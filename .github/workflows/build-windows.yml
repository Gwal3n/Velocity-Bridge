name: Build Windows installer

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: Velocity-Windows
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: Velocity-Windows/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - name: Install Python dependencies
        run: python -m pip install -r src-python/requirements.txt
      - name: Install JavaScript dependencies
        run: npm ci
      - name: Build NSIS installer
        run: npm run tauri -- build --no-sign --bundles nsis
      - uses: actions/upload-artifact@v4
        with:
          name: velocity-bridge-windows-installer
          path: Velocity-Windows/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
